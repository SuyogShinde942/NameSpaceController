# Example source secret in default namespace
# Create this before creating a namespace with replicate-secret: "default/my-secret"
# Usage: kubectl apply -f deploy/examples/example-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: my-secrets
  namespace: default
type: Opaque
stringData:
  username: admin
  password: secret123
  # Add more keys as needed, e.g.:
  # api-key: "your-api-key"
