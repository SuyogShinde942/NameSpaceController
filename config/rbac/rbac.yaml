---
# ServiceAccount for the controller
apiVersion: v1
kind: ServiceAccount
metadata:
  name: namespace-controller
  namespace: default
---
# ClusterRole is needed because we need to access secrets across all namespaces
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: namespace-controller-cluster-role
rules:
  # Watch and list namespaces (cluster-scoped)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # Get secrets from any namespace (source)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  # Create secrets in any namespace (target)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch"]
---
# ClusterRoleBinding to bind ClusterRole to ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: namespace-controller-cluster-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: namespace-controller-cluster-role
subjects:
  - kind: ServiceAccount
    name: namespace-controller
    namespace: default
